[package]
name = "f84ext_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
dumpspace-api = "1.0.0"
egui = { version = "0.29.0", features = ["serde"] }
egui_overlay = { version = "0.9.0", features = ["three_d"] }
egui_render_three_d = "0.9.0"
egui_window_glfw_passthrough = "0.9.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
thiserror = "1.0.64"
windows-sys = { version = "0.59.0", features = [
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Threading",
	"Win32_Security",
] }
tracing = "0.1.41"

[features]
default = ["three_d"]
three_d = [
	"egui_overlay/three_d",
]
wgpu = []
